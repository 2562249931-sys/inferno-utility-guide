<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炼狱小镇 · 道具图鉴</title>
<style>
:root{color-scheme:dark;--bg:#111413;--panel:#1b201e;--line:#343c37;--text:#edf1ec;--muted:#a5afa8;--green:#a6d785;--orange:#e5a36c;--accent:#c4ed9c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}header{position:sticky;top:0;z-index:5;background:#111413ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.top{max-width:1180px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:24px}.brand{font-size:18px;font-weight:750;white-space:nowrap}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:1px}.tabs{display:flex;gap:6px}.tabs button,.tools button{border:1px solid transparent;background:none;color:var(--muted);padding:8px 13px;border-radius:5px;cursor:pointer}.tabs button.active{color:var(--text);background:#29312b;border-color:#414a42}.tools{margin-left:auto;display:flex;gap:8px;align-items:center}.search{width:min(240px,30vw);background:#1c211f;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:8px 11px;outline:none}.search:focus{border-color:var(--green)}.tools button{border-color:var(--line);color:var(--text)}main{max-width:1180px;margin:auto;padding:34px 24px 80px}.intro{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding:8px 0 24px;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--green);letter-spacing:1.5px}.intro h1{font-size:32px;line-height:1.2;margin:8px 0}.intro p{color:var(--muted);margin:0}.count{color:var(--muted);font-size:13px}.section{margin:34px 0 48px;scroll-margin-top:92px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.section-head h2{font-size:21px;margin:0}.section-head:after{content:"";height:1px;background:var(--line);flex:1}.section-head span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}.item-head{padding:14px 16px 10px;display:flex;align-items:baseline;gap:10px}.item-head h3{font-size:16px;margin:0}.item-head .n{font:12px ui-monospace,monospace;color:var(--green)}.item-body{padding:0 16px 14px;color:#c5cdc7;font-size:14px;white-space:pre-line}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px;padding:0 12px 12px}.images img{display:block;width:100%;height:230px;object-fit:contain;background:#101311;border:1px solid #303733;border-radius:3px;cursor:zoom-in}.images img:hover{border-color:#819d74}.empty{padding:28px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:6px}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:20;display:none;background:#080a09f2;align-items:center;justify-content:center;padding:56px 70px}.modal.open{display:flex}.modal img{max-width:100%;max-height:100%;object-fit:contain}.modal button{position:absolute;border:1px solid #566057;background:#171b19;color:white;border-radius:5px;width:42px;height:42px;cursor:pointer}.close{right:22px;top:18px;font-size:23px}.prev{left:20px;top:50%;font-size:24px}.next{right:20px;top:50%;font-size:24px}.caption{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#c9d1ca;font-size:13px}.hint{position:absolute;top:25px;left:24px;color:#a5afa8;font-size:12px}@media(max-width:700px){.top{padding:10px 14px;gap:10px;flex-wrap:wrap}.brand{font-size:16px}.brand small{display:none}.tabs{order:3;width:100%}.tabs button{flex:1}.tools{margin-left:auto}.search{width:145px}main{padding:24px 14px 56px}.intro{align-items:start;gap:12px;flex-direction:column}.intro h1{font-size:27px}.cards{grid-template-columns:1fr}.images img{height:220px}.modal{padding:56px 12px}.prev{left:5px}.next{right:5px}.close{right:10px;top:8px}.hint{left:14px;top:22px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">炼狱小镇<small>UTILITY FIELD GUIDE</small></div><nav class="tabs" aria-label="阵营"><button class="active" data-side="ct">CT 方</button><button data-side="t">T 方</button></nav><div class="tools"><input class="search" id="search" type="search" placeholder="搜索道具 / 说明" aria-label="搜索道具"><button id="reset" title="清除搜索">清除</button></div></div></header>
<main><div class="intro"><div><div class="eyebrow">COUNTER-STRIKE 2 · INFERNO</div><h1 id="pageTitle">CT 方道具</h1><p>投掷点位与准星参考</p></div><div class="count" id="count"></div></div><div id="content"></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="图片预览"><div class="hint">← → 切换 · Esc 关闭</div><button class="close" aria-label="关闭">×</button><button class="prev" aria-label="上一张">‹</button><img id="large" alt="道具截图大图"><button class="next" aria-label="下一张">›</button><div class="caption" id="caption"></div></div>
<script>
const data={ct:[
{section:'开局道具',items:[{title:'Faze 烟',body:'出生位名称',images:['image1.jpeg']},{title:'1 号位',body:'左键跳投',images:['image2.jpeg']},{title:'2 号位',body:'蹲下来瞄这里，然后 W + 左键跳投',images:['image3.jpeg']},{title:'3 号位',body:'左键跳投',images:['image4.jpeg']},{title:'4 号位',body:'左键跳投',images:['image5.jpeg']},{title:'5 号位',body:'左键跳投',images:['image6.jpeg']},{title:'6 号位',body:'左键跳投',images:['image7.jpeg']},{title:'快匪口烟',body:'站位与描点参考\n左键跳投',images:['image8.jpeg','image9.jpeg']}]},
{section:'B 区道具',items:[{title:'蕉道反清闪',body:'站位：抵住面前的大竖条\n左键出手',images:['image10.jpeg','image11.jpeg']},{title:'中段火 + 雷',body:'左键出手',images:['image12.jpeg']},{title:'反清车位闪',body:'左键出手',images:['image13.jpeg']},{title:'X 队蕉道闪',body:'左键跳投',images:['image14.jpeg']},{title:'抢车位闪',body:'对面 Rush 蕉道时投掷\n左键出手',images:['image15.jpeg']},{title:'车位火',body:'站位：一箱上\n左键出手',images:['image16.jpeg','image17.jpeg']},{title:'凹槽火',body:'左键出手（可以跑一步）',images:['image18.jpeg']}]},
{section:'A 区道具',items:[{title:'反清侧道闪',body:'站位：抵住面前的角落\n左键跳投',images:['image19.jpeg','image20.jpeg']},{title:'回防死点火',body:'站位与描点参考\n左键出手',images:['image21.jpeg','image22.jpeg']},{title:'回防隔断烟',body:'隔绝大小坑\n跑一步左键出手',images:['image23.jpeg']}]}
],t:[
{section:'开局道具',items:[{title:'T 字口烟',body:'左键跳投',images:['image1.jpeg']},{title:'T 字口火',body:'大概对准即可，一路跑到匪口台阶顶端左键出手',images:['image2.jpeg']}]},
{section:'中路道具',items:[{title:'连接烟',body:'左键跳投',images:['image3.jpeg']},{title:'摩托烟',body:'左键跳投',images:['image4.jpeg']},{title:'连接瞬闪',body:'左键跳投',images:['image5.jpeg']},{title:'手推连接烟',body:'左键出手',images:['image6.jpeg']},{title:'中路闪',body:'左键出手',images:['image7.jpeg']},{title:'书房烟',body:'站位与投掷参考\n左键跳投',images:['image8.png','image9.jpeg']}]},
{section:'A 点道具',items:[{title:'摩托烟',body:'站位：附近均可\n描点：屋檐顶端均可，稍微靠左\n左键出手',images:['image10.jpeg','image11.jpeg']},{title:'飞二楼套餐 · 草车烟',body:'站位参考\n左键跳投',images:['image12.jpeg','image13.jpeg']},{title:'飞二楼套餐 · 摩托烟',body:'W + 左键跳投',images:['image14.jpeg']},{title:'飞二楼套餐 · 站位',body:'站位参考',images:['image15.jpeg']},{title:'高闪',body:'字母 G 上方的屋檐\n跑到准星与电线杆重合，左键出手',images:['image16.jpeg']}]},
{section:'B 点道具',items:[{title:'1 分 46 秒蕉道闪',body:'双键跳投',images:['image17.jpeg']},{title:'警家烟',body:'站位与描点参考\n左键出手',images:['image18.jpeg','image19.jpeg']},{title:'一点两用',body:'警家烟、棺材烟\n站位：抵住面前这个角落',images:['image20.jpeg']},{title:'警家烟',body:'W + 双键跳投',images:['image21.jpeg']},{title:'棺材烟',body:'左键跳投',images:['image22.jpeg']},{title:'B 包闪',body:'双键跳投',images:['image23.jpeg']},{title:'三箱火',body:'左键跳投 / 左键出手',images:['image24.jpeg','image25.jpeg']},{title:'二箱和三明治',body:'左键出手',images:['image26.jpeg']},{title:'一箱和三明治',body:'左键跳投',images:['image27.jpeg']},{title:'警家闪',body:'左键出手',images:['image28.jpeg']}]}
]};
const content=document.querySelector('#content'),tabs=[...document.querySelectorAll('[data-side]')],search=document.querySelector('#search');let side='ct',visibleImages=[],current=0;
function render(){const q=search.value.trim().toLowerCase(),sections=data[side].map((s,si)=>{const items=s.items.filter(i=>(i.title+i.body+s.section).toLowerCase().includes(q));if(!items.length)return'';return `<section class="section"><div class="section-head"><h2>${s.section}</h2><span>${String(si+1).padStart(2,'0')}</span></div><div class="cards">${items.map((i,ii)=>`<article class="item"><div class="item-head"><span class="n">${String(ii+1).padStart(2,'0')}</span><h3>${i.title}</h3></div>${i.body?`<div class="item-body">${i.body}</div>`:''}<div class="images">${i.images.map((f,j)=>`<img loading="lazy" src="assets/${side}/${f}" alt="${i.title}，截图 ${j+1}" data-caption="${i.title} · ${s.section} · ${j+1}/${i.images.length}">`).join('')}</div></article>`).join('')}</div></section>`}).join('');content.innerHTML=sections||'<div class="empty">没有匹配的道具</div>';document.querySelector('#pageTitle').textContent=(side==='ct'?'CT':'T')+' 方道具';document.querySelector('#count').textContent=`${data[side].reduce((n,s)=>n+s.items.length,0)} 组道具`;}
tabs.forEach(b=>b.addEventListener('click',()=>{side=b.dataset.side;tabs.forEach(x=>x.classList.toggle('active',x===b));render()}));search.addEventListener('input',render);document.querySelector('#reset').addEventListener('click',()=>{search.value='';render();search.focus()});
const modal=document.querySelector('#modal'),large=document.querySelector('#large'),caption=document.querySelector('#caption');function openImage(img){visibleImages=[...document.querySelectorAll('.images img')];current=visibleImages.indexOf(img);showImage();modal.classList.add('open');document.body.style.overflow='hidden'}function showImage(){const img=visibleImages[current];large.src=img.src;large.alt=img.alt;caption.textContent=img.dataset.caption}function close(){modal.classList.remove('open');document.body.style.overflow=''}content.addEventListener('click',e=>{if(e.target.matches('.images img'))openImage(e.target)});document.querySelector('.close').onclick=close;document.querySelector('.prev').onclick=()=>{current=(current-1+visibleImages.length)%visibleImages.length;showImage()};document.querySelector('.next').onclick=()=>{current=(current+1)%visibleImages.length;showImage()};modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')document.querySelector('.prev').click();if(e.key==='ArrowRight')document.querySelector('.next').click()});render();
</script>
</body>
</html>
